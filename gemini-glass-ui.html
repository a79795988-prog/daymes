<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DAYMES - Gemini Glass UI Theme</title>
  <style>
    body {
      background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 40px;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <h2>DAYMES Glass Theme Prototype</h2>
    <p>Modern glassmorphism theme components for healthcare UI.</p>
  </div>
</body>
</html>
